name: Validate estimator
on:
  pull_request:
  push:
    branches: [main, 'portfolio/estimator-validation']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/estimate.test.mjs
